<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e12">
<title>Wonq — Gardien des Absents</title>
<style>html,body{margin:0;min-height:100%;background:#090a0d;color:#f5ead8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#69a99b35,transparent 34rem),radial-gradient(circle at 78% 70%,#a47bb43d,transparent 30rem),#090a0d}.boot div{text-align:center}.sig{font-size:54px;color:#d3a65e;text-shadow:0 0 26px #a47bb466}.boot p{color:#bdb09e}</style>
</head>
<body>
<div class="boot"><div><div class="sig">◌</div><h1>Wonq</h1><p>Ouverture du registre des absents…</p></div></div>
<script>
(async()=>{
 try{
  const base='https://raw.githubusercontent.com/bryantoualy-del/Wonq/689201c0a472ebd806183b1747d3d1e481ad30ea/index.html';
  const [baseResponse,talesResponse,combatFxResponse,fxOverhaulResponse,socialJournalResponse,taleRegistryResponse,rpgConnectResponse,sessionJournalResponse,spellDocsResponse]=await Promise.all([fetch(base,{cache:'no-store'}),fetch('tales-aidedd.js?v=2',{cache:'no-store'}),fetch('wonq-combat-fx.js?v=5',{cache:'no-store'}),fetch('wonq-fx-overhaul.js?v=1',{cache:'no-store'}),fetch('social-journal.js?v=3',{cache:'no-store'}),fetch('tale-registry.js?v=2',{cache:'no-store'}),fetch('rpg-connect.js?v=1',{cache:'no-store'}),fetch('session-journal.js?v=6',{cache:'no-store'}),fetch('spell-docs.js?v=1',{cache:'no-store'})]);
  let html=await baseResponse.text();
  const talesCode=await talesResponse.text();
  const combatFxCode=await combatFxResponse.text();
  const fxOverhaulCode=await fxOverhaulResponse.text();
  const socialJournalCode=await socialJournalResponse.text();
  const taleRegistryCode=await taleRegistryResponse.text();
  const rpgConnectCode=await rpgConnectResponse.text();
  const sessionJournalCode=await sessionJournalResponse.text();
  const spellDocsCode=await spellDocsResponse.text();
  const appEnd=html.lastIndexOf('})();');
  if(appEnd<0)throw new Error('Moteur principal introuvable');
  html=html.slice(0,appEnd)+talesCode+combatFxCode+fxOverhaulCode+socialJournalCode+taleRegistryCode+rpgConnectCode+sessionJournalCode+spellDocsCode+html.slice(appEnd);
  const quickAccessStart=html.indexOf('<article class="panel"><h2>Accès rapide</h2>');
  /* Keep the historical quick-action controls in the DOM so the legacy
     binder can attach every handler. They stay visually removed, as requested. */
  if(quickAccessStart>=0){
   html=html.slice(0,quickAccessStart)+html.slice(quickAccessStart).replace(
    '<article class="panel"><h2>Accès rapide</h2>',
    '<article class="panel" hidden aria-hidden="true"><h2>Accès rapide</h2>'
   );
  }
  const sessionSpellDropdown=`
<select id="sessionSpell" class="number" style="max-width:360px">
  <option value="">Choisir un sort éligible…</option>
  <optgroup label="Niveau 1 · Divination">
    <option>Communication avec les animaux</option>
    <option>Compréhension des langues</option>
    <option>Détection de la magie</option>
    <option>Détection du mal et du bien</option>
    <option>Détection du poison et des maladies</option>
    <option>Identification</option>
    <option>Lien avec une bête</option>
    <option>Marque du chasseur</option>
  </optgroup>
  <optgroup label="Niveau 1 · Nécromancie">
    <option>Blessure</option>
    <option>Frayeur</option>
    <option>Rayon empoisonné</option>
    <option>Simulacre de vie</option>
  </optgroup>
  <optgroup label="Niveau 2 · Divination">
    <option>Augure</option>
    <option>Détection des pensées</option>
    <option>Épine mentale</option>
    <option>Localisation d'animaux ou de plantes</option>
    <option>Localisation d'objet</option>
    <option>Sens animal</option>
    <option>Sens des pièges</option>
    <option>Voir l'invisible</option>
  </optgroup>
  <optgroup label="Niveau 2 · Nécromancie">
    <option>Cécité/Surdité</option>
    <option>Préservation des morts</option>
    <option>Rayon affaiblissant</option>
  </optgroup>
  <optgroup label="Niveau 3 · Divination">
    <option>Clairvoyance</option>
    <option>Don des langues</option>
  </optgroup>
  <optgroup label="Niveau 3 · Nécromancie">
    <option>Animation des morts</option>
    <option>Communication avec les morts</option>
    <option>Convocation de mort-vivant</option>
    <option>Malédiction</option>
    <option>Mort simulée</option>
    <option>Retour à la vie</option>
    <option>Toucher du vampire</option>
    <option>Transfert de vie</option>
    <option>Voile spirituel</option>
  </optgroup>
</select>`;
  html=html.replace(
   '<input id="sessionSpell" class="number" placeholder="Sort retenu" style="max-width:260px">',
   sessionSpellDropdown
  );
  html=html.replace('</body>','<script src="signature-icon.js?v=10"><\/script><script src="contextual-icons.js?v=5"><\/script></body>');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div class="boot"><div><h1>Wonq</h1><p>Impossible de charger le compagnon. Recharge la page.</p></div></div>'}
})();
</script>
</body>
</html>
